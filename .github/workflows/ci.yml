name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - devel
      - bepolia

permissions:
  contents: read

jobs:
  ci:
    runs-on:
      labels: ubuntu-latest
    strategy:
      matrix:
        include:
          - job_name: lint
            command: bun run lint
            summary: "## Lint result"
          - job_name: build
            command: forge build
            summary: "## Build result"
          - job_name: coverage
            command: forge coverage --fuzz-runs 256 --report lcov --report-file ./test-forge-cover.txt
            summary: "## Coverage result"
    name: ${{ matrix.job_name }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@c7450ba673e133f5ee30098b3b54f444d3a2ca2d # v1.8.0

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install the Node.js dependencies
        run: bun install

      - name: Execute Job Command
        run: ${{ matrix.command }}

      - name: Add Job Summary
        run: |
          echo ${{ matrix.summary }} >> $GITHUB_STEP_SUMMARY
          echo "✅ Passed" >> $GITHUB_STEP_SUMMARY

      - if: ${{ matrix.job_name == 'coverage' }}
        name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./test-forge-cover.txt
